name: TikSave v0.2.0 Temporary Build
on:
  push:
    branches:
      - 'tmp/tiksave-v0.2.0-build-20260920'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build TikSave and capture log
        id: android_build
        shell: bash
        run: |
          mkdir -p /tmp/tiksave-out
          set +e
          cd tiksave-build/project
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee /tmp/tiksave-out/build.log
          code=${PIPESTATUS[0]}
          echo "$code" > /tmp/tiksave-out/build-exit-code.txt
          exit 0
      - name: Verify signature and manifest when APK exists
        shell: bash
        run: |
          APK="tiksave-build/project/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" /tmp/tiksave-out/TikSave-v0.2.0.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/tiksave-out/TikSave-v0.2.0.apk | tee /tmp/tiksave-out/signature.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging /tmp/tiksave-out/TikSave-v0.2.0.apk | head -40 > /tmp/tiksave-out/manifest.txt
            sha256sum /tmp/tiksave-out/TikSave-v0.2.0.apk > /tmp/tiksave-out/TikSave-v0.2.0.apk.sha256
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TikSave-v0.2.0
          path: /tmp/tiksave-out/*
          if-no-files-found: error
      - name: Fail if Android build failed
        shell: bash
        run: |
          code=$(cat /tmp/tiksave-out/build-exit-code.txt)
          exit "$code"
