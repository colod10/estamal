name: Temporary TikSave Build
on:
  pull_request:
    branches:
      - main
    paths:
      - 'tiksave-build/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build TikSave v0.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch "$GITHUB_HEAD_REF" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/repo

          base64 -d /tmp/repo/tiksave-build/TikSave-v0.2.0-source.b64 > /tmp/TikSave-v0.2.0-source.zip
          mkdir -p /tmp/tiksave-src
          unzip -q /tmp/TikSave-v0.2.0-source.zip -d /tmp/tiksave-src

          JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

          curl -fL --retry 3 "https://services.gradle.org/distributions/gradle-9.6.0-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

          cd /tmp/tiksave-src/TikSave
          /tmp/gradle-9.6.0/bin/gradle --no-daemon :app:assembleDebug --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/signature.txt
          sha256sum "$APK" > /tmp/sha256.txt

          cp "$APK" /tmp/repo/tiksave-build/TikSave-v0.2.0.apk
          cp /tmp/badging.txt /tmp/repo/tiksave-build/TikSave-v0.2.0.badging.txt
          cp /tmp/signature.txt /tmp/repo/tiksave-build/TikSave-v0.2.0.signature.txt
          cp /tmp/sha256.txt /tmp/repo/tiksave-build/TikSave-v0.2.0.sha256.txt

          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiksave-build/TikSave-v0.2.0.*
          git commit -m "build: publish TikSave v0.2.0 [skip ci]"
          git push origin "HEAD:$GITHUB_HEAD_REF"
